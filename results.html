<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>النتائج · مسابقة التواصل الشفهي</title>
  <meta name="theme-color" content="#2f5d3a">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#2f5d3a; --green-d:#1f3f27; --sage:#9caf88; --sage-l:#dfe7d6;
    --beige:#efe8d8; --cream:#f8f5ee; --ink:#1f2a22; --muted:#5f6b60; --gold:#c9a227;
    --line:#e2dccd; --red:#a33b2b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px}
  .top{background:linear-gradient(135deg,var(--green) 0%,var(--green-d) 100%);color:#fff;padding:26px 0 30px;border-bottom:6px solid var(--sage)}
  .eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;direction:ltr;text-align:right}
  .top h1{margin:4px 0 2px;font-size:clamp(24px,5.5vw,36px);font-weight:800;line-height:1.25}
  .top .sub{margin:0;opacity:.9;font-size:16px}
  main{padding:18px 0 40px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 14px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .center{text-align:center}
  h2{margin:0 0 12px;font-size:19px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  h2 small{font-weight:500;color:var(--muted);font-size:13px}
  .num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sage-l);color:var(--green);font-weight:800;font-size:15px}
  .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .chip{border:2px solid var(--line);background:var(--cream);border-radius:12px;padding:12px 6px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;color:var(--ink)}
  .chip span{display:block;font-weight:500;font-size:12px;color:var(--muted)}
  .chip.on{border-color:var(--green);background:var(--green);color:#fff}
  .chip.on span{color:#e6efe0}
  select,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--cream);color:var(--ink)}
  select:focus,textarea:focus{outline:none;border-color:var(--sage)}
  .pinfo{margin-top:10px;font-size:14px;color:var(--muted)}
  .pinfo b{color:var(--ink)}
  .crit{padding:14px 0;border-top:1px dashed var(--line)}
  .crit:first-child{border-top:0;padding-top:0}
  .crit-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
  .crit h3{margin:0;font-size:17px}
  .crit .en{font-size:13px;color:var(--muted);direction:ltr}
  .crit p{margin:4px 0 8px;font-size:14px;color:var(--muted)}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--beige);color:var(--green-d);font-weight:700}
  .tag.moe{background:var(--sage-l)}
  .tag.atl{background:#fff;border:1px solid var(--sage);color:var(--green)}
  .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .scale button{font:inherit;font-weight:800;font-size:18px;padding:10px 0;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
  .scale button.on{background:var(--green);border-color:var(--green);color:#fff}
  .scale button.lit{background:var(--sage-l);border-color:var(--sage)}
  .scale-label{font-size:13px;color:var(--green);font-weight:700;min-height:20px;margin-top:6px}
  .submitbar{position:sticky;bottom:0;background:rgba(248,245,238,.96);backdrop-filter:blur(6px);padding:12px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line)}
  .total{font-size:16px}
  .total b{font-size:22px;color:var(--green)}
  .btn{font:inherit;font-weight:800;font-size:16px;background:var(--green);color:#fff;border:0;border-radius:12px;padding:13px 20px;cursor:pointer;text-decoration:none;display:inline-block}
  .btn:disabled{opacity:.55;cursor:wait}
  .btn.ghost{background:transparent;color:var(--green);border:2px solid var(--green)}
  .error{color:var(--red);font-weight:700;text-align:center}
  .big{font-size:56px;line-height:1;margin:6px 0}
  .muted{color:var(--muted)}
  .links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
</style>

<script>
window.API_URL = 'https://script.google.com/macros/s/AKfycbyY4mDaBTbjvVBZXuhRxdd6ifsnvCwc0hKrJ5BFA2uzOYlGvRmpY55k7lciFcpb5WpSkw/exec';
window.google = { script: { run: (function () {
  function get(q) { return fetch(API_URL + '?api=' + q).then(function (r) { return r.json(); }); }
  function post(action, payload) {
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, payload: payload }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.error || 'Error'); return j.data; });
  }
  var calls = {
    getPublicData: function () { return get('data'); },
    getResults: function () { return get('results'); },
    submitVote: function (p) { return post('vote', p); },
    addStudent: function (p) { return post('add', p); }
  };
  function runner(ok, fail) {
    var api = {
      withSuccessHandler: function (f) { return runner(f, fail); },
      withFailureHandler: function (f) { return runner(ok, f); }
    };
    Object.keys(calls).forEach(function (k) {
      api[k] = function (arg) {
        calls[k](arg).then(function (r) { ok && ok(r); }).catch(function (e) { fail && fail(e); });
      };
    });
    return api;
  }
  return runner(null, null);
})() } };
</script>
  <style>
    .wrap{max-width:1100px}
    .winners{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:14px}
    .ycol{display:flex;flex-direction:column;gap:8px}
    .yname{text-align:center;font-weight:800;font-size:20px;color:#fff;background:var(--green);border-radius:14px;padding:8px}
    .podium{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
    .podium .pn{font-size:16px}
    .podium b{font-size:20px;color:var(--green)}
    .toggle{display:block;margin:0 auto 14px}
    .win{background:linear-gradient(135deg,#fffaf0,#f3ead2);border:2px solid var(--gold);border-radius:18px;text-align:center;padding:20px 14px}
    .win .cup{font-size:44px;line-height:1}
    .win .lbl{font-weight:800;color:var(--gold);font-size:14px}
    .win .n{font-size:clamp(22px,3vw,30px);font-weight:800;margin:6px 0 2px;direction:ltr}
    .win .t{font-size:14px;color:var(--muted)}
    .win .sc{font-size:34px;font-weight:800;color:var(--green);margin-top:6px}
    .win .sc small{font-size:15px;color:var(--muted)}
    .win.none{border-style:dashed;border-color:var(--line);background:#fff}
    .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
    .tabs button{font:inherit;font-weight:700;font-size:15px;min-height:42px;padding:6px 16px;border-radius:999px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
    .tabs button.on{background:var(--green);border-color:var(--green);color:#fff}
    .row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
    .row:first-of-type{border-top:0}
    .rank{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--sage-l);color:var(--green)}
    .rank.r1{background:var(--gold);color:#fff}.rank.r2{background:#a9adb3;color:#fff}.rank.r3{background:#c58b5a;color:#fff}
    .pn{font-weight:800;font-size:17px;direction:ltr;text-align:right}
    .ps{font-size:13px;color:var(--muted)}
    .bar{height:9px;background:var(--beige);border-radius:99px;overflow:hidden;margin-top:6px}
    .bar i{display:block;height:100%;background:linear-gradient(270deg,var(--sage),var(--green));border-radius:99px;transition:width .6s}
    .scr{text-align:center;min-width:80px}
    .scr b{font-size:22px;color:var(--green)}
    .scr div{font-size:12px;color:var(--muted)}
    .pending{opacity:.55}
    .stats{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
    .more{display:block;margin:10px auto 0}
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="eyebrow">Arabic A · Oral Communication · Live results</div>
      <h1 id="title">مسابقة التواصل الشفهي باللغة العربية</h1>
      <p class="sub">النتائج المباشرة · Live results</p>
    </div>
  </header>
  <main class="wrap">
    <div id="msg" class="card center muted">جارٍ التحميل… Loading…</div>
    <div id="winners" class="winners" hidden></div>
    <button type="button" class="btn ghost toggle" id="toggleBoard" hidden>الترتيب الكامل · Full ranking</button>
    <div id="board" class="card" hidden>
      <h2>الترتيب · Ranking</h2>
      <div class="tabs" id="tabs"></div>
      <div id="list"></div>
      <button type="button" class="btn ghost more" id="more" hidden>عرض الكل · Show all</button>
    </div>
    <div class="card stats"><span id="stats"></span><span id="updated"></span></div>
    <div class="links">
      <a class="btn ghost" id="voteLink">صفحة التقييم · Rating form</a>
      <a class="btn ghost" id="qrLink">رموز QR · QR codes</a>
    </div>
  </main>

<script>
const CONFIG = {
  baseUrl: location.origin + location.pathname.replace(/[^/]*$/, ''),
  projectId: (new URLSearchParams(location.search).get('project') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 20),
  page: 'results'
};
const $ = id => document.getElementById(id);
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
$('voteLink').href = CONFIG.baseUrl + '?page=vote';
$('qrLink').href = CONFIG.baseUrl + '?page=qr';
const f1 = n => (Math.round(n * 10) / 10).toFixed(1);
let LAST = null, tab = '', showAll = false, boardOpen = false;

function render(r) {
  LAST = r;
  $('title').textContent = r.title;
  document.title = r.title + ' — النتائج';
  $('updated').textContent = 'آخر تحديث ' + new Date(r.updated).toLocaleTimeString('ar-AE', { hour: '2-digit', minute: '2-digit' });

  if (r.hidden || !r.totalVotes) {
    $('winners').hidden = true; $('board').hidden = true; $('toggleBoard').hidden = true; $('msg').hidden = false;
    $('msg').textContent = '';
    $('msg').appendChild(el('div', 'big', r.hidden ? '🏆' : '⭐'));
    $('msg').appendChild(el('h2', '', r.hidden ? 'ستُعلن النتائج قريباً' : 'لا توجد تقييمات بعد'));
    $('msg').appendChild(el('p', 'muted', r.hidden ? 'Results will be announced soon' : 'No ratings yet'));
    $('stats').textContent = '';
    return;
  }
  $('msg').hidden = true;
  $('stats').textContent = 'عدد التقييمات ' + r.totalVotes + ' · Ratings ' + r.totalVotes +
    (r.minVotes ? ' · يحتاج المتحدث إلى ' + r.minVotes + ' تقييمات على الأقل للترتيب' : '');

  // top student per year group (+ 2nd and 3rd)
  const years = [...new Set(r.projects.map(p => p.year).filter(Boolean))].sort((a, b) => parseInt(a.replace(/\D/g, '')) - parseInt(b.replace(/\D/g, '')));
  const wb = $('winners'); wb.textContent = '';
  (years.length ? years : ['']).forEach(y => {
    const top = r.projects.filter(p => p.eligible && (!y || p.year === y)).slice(0, 3);
    const col = el('div', 'ycol');
    col.appendChild(el('div', 'yname', y || 'الكل'));
    const w = top[0];
    const c = el('div', 'win' + (w ? '' : ' none'));
    c.appendChild(el('div', 'cup', w ? '🏆' : '⏳'));
    c.appendChild(el('div', 'lbl', 'المركز الأول · 1st'));
    if (w) {
      c.appendChild(el('div', 'n', w.name));
      if (w.title || w.topic) c.appendChild(el('div', 't', w.title || w.topic));
      const sc = el('div', 'sc', f1(w.avg)); sc.appendChild(el('small', '', ' / ' + r.max)); c.appendChild(sc);
      c.appendChild(el('div', 't', w.count + ' تقييم'));
    } else {
      c.appendChild(el('div', 't', 'بانتظار التقييمات · Waiting for ratings'));
    }
    col.appendChild(c);
    top.slice(1).forEach((p, i) => {
      const row = el('div', 'podium');
      row.appendChild(el('div', 'rank r' + (i + 2), String(i + 2)));
      const mid = el('div');
      mid.appendChild(el('div', 'pn', p.name));
      mid.appendChild(el('div', 'ps', p.count + ' تقييم'));
      row.appendChild(mid);
      row.appendChild(el('b', '', f1(p.avg)));
      col.appendChild(row);
    });
    wb.appendChild(col);
  });
  wb.hidden = false;
  $('toggleBoard').hidden = false;
  $('toggleBoard').textContent = boardOpen ? 'إخفاء الترتيب الكامل · Hide full ranking' : 'الترتيب الكامل · Full ranking';

  // tabs
  const tb = $('tabs'); tb.textContent = '';
  [''].concat(years).forEach(y => {
    const b = el('button', y === tab ? 'on' : '', y || 'الكل · All');
    b.type = 'button';
    b.addEventListener('click', () => { tab = y; showAll = false; render(LAST); });
    tb.appendChild(b);
  });

  // list
  const list = $('list'); list.textContent = '';
  const rows = r.projects.filter(p => !tab || p.year === tab);
  const shown = showAll ? rows : rows.slice(0, 15);
  let rank = 0;
  rows.forEach((p, i) => {
    if (p.eligible) rank++;
    if (i >= shown.length) return;
    const row = el('div', 'row' + (p.eligible ? '' : ' pending'));
    row.appendChild(el('div', 'rank' + (p.eligible && rank <= 3 ? ' r' + rank : ''), p.eligible ? String(rank) : '–'));
    const mid = el('div');
    mid.appendChild(el('div', 'pn', p.name));
    const crit = p.count ? r.criteria.map((c, k) => c.short + ' ' + f1(p.critAvg[k])).join(' · ') : '';
    mid.appendChild(el('div', 'ps', [p.year, p.title || p.topic, crit].filter(Boolean).join(' · ')));
    const bar = el('div', 'bar'), fill = el('i');
    fill.style.width = (r.max ? p.avg / r.max * 100 : 0) + '%';
    bar.appendChild(fill); mid.appendChild(bar);
    row.appendChild(mid);
    const sc = el('div', 'scr');
    sc.appendChild(el('b', '', p.count ? f1(p.avg) : '—'));
    sc.appendChild(el('div', '', 'من ' + r.max + ' · ' + p.count + ' تقييم'));
    row.appendChild(sc);
    list.appendChild(row);
  });
  $('more').hidden = showAll || rows.length <= 15;
  $('board').hidden = !boardOpen;
}
$('more').addEventListener('click', () => { showAll = true; render(LAST); });
$('toggleBoard').addEventListener('click', () => { boardOpen = !boardOpen; render(LAST); });

function load() {
  google.script.run
    .withSuccessHandler(render)
    .withFailureHandler(() => { $('updated').textContent = 'تعذّر التحديث، ستتم المحاولة مجدداً…'; })
    .getResults();
}
load();
setInterval(load, 15000);
</script>
</body>
</html>
