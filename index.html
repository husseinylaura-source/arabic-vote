<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>قيّم المتحدث · مسابقة التواصل الشفهي</title>
  <meta name="theme-color" content="#2f5d3a">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#2f5d3a; --green-d:#1f3f27; --sage:#9caf88; --sage-l:#dfe7d6;
    --beige:#efe8d8; --cream:#f8f5ee; --ink:#1f2a22; --muted:#5f6b60; --gold:#c9a227;
    --line:#e2dccd; --red:#a33b2b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px}
  .top{background:linear-gradient(135deg,var(--green) 0%,var(--green-d) 100%);color:#fff;padding:26px 0 30px;border-bottom:6px solid var(--sage)}
  .eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;direction:ltr;text-align:right}
  .top h1{margin:4px 0 2px;font-size:clamp(24px,5.5vw,36px);font-weight:800;line-height:1.25}
  .top .sub{margin:0;opacity:.9;font-size:16px}
  main{padding:18px 0 40px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 14px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .center{text-align:center}
  h2{margin:0 0 12px;font-size:19px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  h2 small{font-weight:500;color:var(--muted);font-size:13px}
  .num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sage-l);color:var(--green);font-weight:800;font-size:15px}
  .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .chip{border:2px solid var(--line);background:var(--cream);border-radius:12px;padding:12px 6px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;color:var(--ink)}
  .chip span{display:block;font-weight:500;font-size:12px;color:var(--muted)}
  .chip.on{border-color:var(--green);background:var(--green);color:#fff}
  .chip.on span{color:#e6efe0}
  select,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--cream);color:var(--ink)}
  select:focus,textarea:focus{outline:none;border-color:var(--sage)}
  .pinfo{margin-top:10px;font-size:14px;color:var(--muted)}
  .pinfo b{color:var(--ink)}
  .crit{padding:14px 0;border-top:1px dashed var(--line)}
  .crit:first-child{border-top:0;padding-top:0}
  .crit-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
  .crit h3{margin:0;font-size:17px}
  .crit .en{font-size:13px;color:var(--muted);direction:ltr}
  .crit p{margin:4px 0 8px;font-size:14px;color:var(--muted)}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--beige);color:var(--green-d);font-weight:700}
  .tag.moe{background:var(--sage-l)}
  .tag.atl{background:#fff;border:1px solid var(--sage);color:var(--green)}
  .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .scale button{font:inherit;font-weight:800;font-size:18px;padding:10px 0;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
  .scale button.on{background:var(--green);border-color:var(--green);color:#fff}
  .scale button.lit{background:var(--sage-l);border-color:var(--sage)}
  .scale-label{font-size:13px;color:var(--green);font-weight:700;min-height:20px;margin-top:6px}
  .submitbar{position:sticky;bottom:0;background:rgba(248,245,238,.96);backdrop-filter:blur(6px);padding:12px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line)}
  .total{font-size:16px}
  .total b{font-size:22px;color:var(--green)}
  .btn{font:inherit;font-weight:800;font-size:16px;background:var(--green);color:#fff;border:0;border-radius:12px;padding:13px 20px;cursor:pointer;text-decoration:none;display:inline-block}
  .btn:disabled{opacity:.55;cursor:wait}
  .btn.ghost{background:transparent;color:var(--green);border:2px solid var(--green)}
  .error{color:var(--red);font-weight:700;text-align:center}
  .big{font-size:56px;line-height:1;margin:6px 0}
  .muted{color:var(--muted)}
  .links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
</style>

<script>
window.API_URL = 'https://script.google.com/macros/s/AKfycbwBA3iY7kzZPwp8DLl5d9Ya0-vaBjB2ucYUoC4-EsnXxqFiS4vm9YVRlP5pqnKqcrPawQ/exec';
window.google = { script: { run: (function () {
  function get(q) { return fetch(API_URL + '?api=' + q).then(function (r) { return r.json(); }); }
  function post(action, payload) {
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, payload: payload }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.error || 'Error'); return j.data; });
  }
  var calls = {
    getPublicData: function () { return get('data'); },
    getResults: function () { return get('results'); },
    submitVote: function (p) { return post('vote', p); },
    addStudent: function (p) { return post('add', p); }
  };
  function runner(ok, fail) {
    var api = {
      withSuccessHandler: function (f) { return runner(f, fail); },
      withFailureHandler: function (f) { return runner(ok, f); }
    };
    Object.keys(calls).forEach(function (k) {
      api[k] = function (arg) {
        calls[k](arg).then(function (r) { ok && ok(r); }).catch(function (e) { fail && fail(e); });
      };
    });
    return api;
  }
  return runner(null, null);
})() } };
</script>
  <style>
    .top{padding:16px 0 18px}
    .top .wrap{position:relative}
    .top h1{font-size:clamp(20px,5vw,28px);padding-inline-end:90px}
    .top .sub2{margin:2px 0 0;opacity:.8;font-size:14px}
    .langsw{position:absolute;top:0;inset-inline-end:16px;font:inherit;font-size:13px;font-weight:700;color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:34px}
    html[dir=ltr] .eyebrow{text-align:left}

    .names{display:grid;gap:6px}

    .name small{font-weight:500;color:var(--muted);font-size:13px}
    .name.done{opacity:.55}
    .name.done::after{content:'✓';color:var(--green);font-weight:800}
    .speaker{text-align:center;background:var(--green);color:#fff;border-radius:16px;padding:16px;margin-bottom:14px}
    .speaker .n{font-size:24px;font-weight:800;direction:ltr}
    .speaker .m{opacity:.85;font-size:14px}

    .q{padding:14px 0;border-top:1px dashed var(--line)}

    .q h3 .qn{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sage-l);color:var(--green);font-size:13px;margin-top:2px}
    .q .h{font-size:13.5px;color:var(--ink);opacity:.8;margin:4px 0 0}
    .q .h2{font-size:12.5px;color:var(--muted);margin:1px 0 8px}
    .stars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;direction:ltr}
    .stars button{font-size:28px;line-height:1;padding:8px 0;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;filter:grayscale(1);opacity:.45}
    .stars button.lit{filter:none;opacity:1;border-color:var(--gold);background:#fffaf0}
    .stars-l{font-size:13px;font-weight:700;color:var(--green);min-height:18px;margin-top:4px}
    .progress{position:sticky;top:0;z-index:2;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);padding:8px 0;margin-bottom:8px;font-size:14px;font-weight:700;color:var(--green);display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
    .send{width:100%;font-size:18px;padding:14px;margin-top:6px}

    .note{font-size:13px;text-align:center;color:var(--muted);margin:12px 0 0}
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <button type="button" class="langsw" id="langsw" hidden>English</button>
      <div class="eyebrow">Arabic A · Oral Communication</div>
      <h1 id="title">مسابقة التواصل الشفهي باللغة العربية</h1>
      <p class="sub2" id="subtitle">Arabic Oral Communication Competition</p>
    </div>
  </header>

  <main class="wrap">
    <div id="loading" class="card center muted">جارٍ التحميل… Loading…</div>

    <!-- Step 0: language -->
    <section id="lang" class="card" hidden>
      <h2 style="justify-content:center;text-align:center">اختر اللغة · Choose your language</h2>
      <div class="langpick">
        <button type="button" class="langbtn" data-lang="ar"><b>العربية</b><span>ابدأ بالعربية (مع الإنجليزية تحتها)</span></button>
        <button type="button" class="langbtn" data-lang="en" dir="ltr"><b>English</b><span>Start in English (with Arabic underneath)</span></button>
      </div>
    </section>

    <div id="closed" class="card center" hidden>
      <div class="big">🔒</div>
      <h2 style="justify-content:center" data-t="closed"></h2>
    </div>

    <!-- Step 1: find a speaker -->
    <section id="find" class="card" hidden>
      <h2 data-t="find"></h2>
      <input id="q" class="search" type="search" autocomplete="off">
      <div class="years" id="years"></div>
      <div class="names" id="names"></div>
      <p class="note" data-t="missing"></p>
    </section>

    <!-- Step 2: rate -->
    <section id="rate" hidden>
      <div class="speaker"><div class="n" id="spName"></div><div class="m" id="spMeta"></div></div>
      <div class="card">
        <div id="voterBox">
          <h2 data-t="who"></h2>
          <div class="voters" id="voters"></div>
        </div>
        <div class="who" id="whoLine" hidden><span><span data-t1="ratingAs"></span> <b id="whoName"></b></span><button type="button" id="changeWho" data-t1="change"></button></div>
        <div class="progress"><span id="prog"></span><span id="tot"></span></div>
        <div id="qs"></div>
        <button type="button" class="addc" id="addc" data-t1="addComment"></button>
        <textarea id="comment" maxlength="300" rows="2" hidden></textarea>
        <p id="error" class="error" hidden></p>
        <button type="button" id="send" class="btn send"></button>

      <p class="muted" data-t="next"></p>
      <button type="button" id="again" class="btn" data-t="again"></button>
    </div>
  </main>

<script>
const CONFIG = {
  baseUrl: location.origin + location.pathname.replace(/[^/]*$/, ''),
  projectId: (new URLSearchParams(location.search).get('project') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 20),
  page: 'vote'
};
const T = {
  ar: {
    title: 'مسابقة التواصل الشفهي باللغة العربية', closed: 'التصويت مغلق حالياً', find: 'اختر المتحدث الذي تريد تقييمه',
    search: 'اكتب اسم الطالب…', all: 'الكل', noMatch: 'لا توجد نتائج', narrow: 'اكتب جزءاً من الاسم لرؤية المزيد',
    missing: 'لا تجد الاسم؟ أخبر معلم اللغة العربية', who: 'من أنت؟', ratingAs: 'تقيّم بصفتك:', change: 'تغيير',
    student: 'طالب', parent: 'ولي أمر', staff: 'معلم / زائر',
    scale: ['يحتاج إلى تطوير', 'مقبول', 'جيد', 'جيد جداً', 'ممتاز'],
    prog: (n, m) => 'تم تقييم ' + n + ' من ' + m, total: 'المجموع',
    addComment: '+ أضف كلمة تشجيع (اختياري)', commentPh: 'كلمة تشجيع للمتحدث…',
    send: 'أرسل التقييم', sending: 'جارٍ الإرسال…', back: '→ اختر متحدثاً آخر',
    thanks: 'شكراً! تم إرسال تقييمك', next: 'يمكنك الآن تقييم متحدث آخر', again: 'قيّم متحدثاً آخر',
    errWho: 'اختر: طالب / ولي أمر / معلم', errRate: n => 'أكمل تقييم جميع المعايير (' + n + ' متبقية)',
    errDone: 'لقد قيّمت هذا المتحدث من قبل', switchTo: 'English'
  },
  en: {
    title: 'Arabic Oral Communication Competition', closed: 'Voting is closed', find: 'Choose the speaker you want to rate',
    search: 'Type a student name…', all: 'All', noMatch: 'No match', narrow: 'Type part of a name to see more',
    missing: 'Name missing? Tell the Arabic teacher', who: 'Who are you?', ratingAs: 'Rating as:', change: 'Change',
    student: 'Student', parent: 'Parent', staff: 'Staff / Visitor',
    scale: ['Needs work', 'Fair', 'Good', 'Very good', 'Excellent'],
    prog: (n, m) => n + ' of ' + m + ' rated', total: 'Total',
    addComment: '+ Add a comment (optional)', commentPh: 'A word of encouragement…',
    send: 'Send rating', sending: 'Sending…', back: '← Choose another speaker',
    thanks: 'Thank you! Your rating was sent', next: 'You can now rate another speaker', again: 'Rate another speaker',
    errWho: 'Choose: Student / Parent / Staff', errRate: n => 'Please rate every criterion (' + n + ' left)',
    errDone: 'You have already rated this speaker', switchTo: 'العربية'
  }
};
const VOTERS = ['student', 'parent', 'staff'];
let LANG = 'ar', chosen = false, DATA = null, current = null, yearFilter = '';
const scores = {};

const $ = id => document.getElementById(id);
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
const other = () => LANG === 'ar' ? 'en' : 'ar';
const pick = (l, k, a) => { const v = T[l][k]; return typeof v === 'function' ? v(...a) : v; };
const t = (k, ...a) => pick(LANG, k, a);
const t2 = (k, ...a) => pick(other(), k, a);
const both = (k, ...a) => t(k, ...a) + ' · ' + t2(k, ...a);
// primary text with the second language in a smaller line underneath
function dual(node, k) { node.textContent = t(k); node.appendChild(el('span', 'alt', t2(k))); }

function deviceId() {
  let d = store('aoc_device');
  if (!d) { d = Math.random().toString(36).slice(2) + Date.now().toString(36); store('aoc_device', d); }
  return d || (window._dev = window._dev || Math.random().toString(36).slice(2));
}
let voted = (() => { try { return JSON.parse(store('aoc_voted') || '[]'); } catch (e) { return []; } })();
function markVoted(id) { voted.push(id); store('aoc_voted', JSON.stringify(voted)); }
let voter = store('aoc_voter');
if (!VOTERS.includes(voter)) voter = null;
const SCREENS = ['lang', 'find', 'rate', 'done', 'closed', 'loading'];
function showOnly(id) { SCREENS.forEach(x => $(x).hidden = x !== id); window.scrollTo(0, 0); }
function showError(m) { $('error').textContent = m || ''; $('error').hidden = !m; }

function setLang(l) {
  LANG = l; store('aoc_lang', l);
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  applyText();
}

function applyText() {
  const arTitle = DATA ? DATA.title : T.ar.title;
  $('title').textContent = LANG === 'ar' ? arTitle : T.en.title;
  $('subtitle').textContent = LANG === 'ar' ? T.en.title : arTitle;
  document.title = $('title').textContent;
  $('langsw').textContent = t('switchTo');
  $('langsw').hidden = !chosen;
  document.querySelectorAll('[data-t]').forEach(n => dual(n, n.dataset.t));
  document.querySelectorAll('[data-t1]').forEach(n => n.textContent = t(n.dataset.t1));
  $('q').placeholder = both('search');
  $('comment').placeholder = t('commentPh');
  $('send').textContent = both('send');
  $('backBtn').textContent = t('back');
  if (DATA) {
    buildYears(); buildVoters(); buildCriteria(); renderNames(); updateProgress();
    if (voter) setVoter(voter, true);
  }
}

function buildYears() {
  const years = [...new Set(DATA.projects.map(p => p.year).filter(Boolean))];
  const yb = $('years'); yb.textContent = '';
  [''].concat(years).forEach(y => {
    const b = el('button', y === yearFilter ? 'on' : '', y || t('all'));
    b.type = 'button';
    b.addEventListener('click', () => { yearFilter = y; [...yb.children].forEach(c => c.classList.toggle('on', c === b)); renderNames(); });
    yb.appendChild(b);
  });
}

function buildVoters() {
  const box = $('voters'); box.textContent = '';
  VOTERS.forEach(id => {
    const b = el('button', 'chip' + (voter === id ? ' on' : ''));
    b.type = 'button';
    dual(b, id);
    b.addEventListener('click', () => setVoter(id));
    box.appendChild(b);
  });
}

function scaleText(n) { return n + ' — ' + T[LANG].scale[n - 1] + ' · ' + T[other()].scale[n - 1]; }

function buildCriteria() {
  const wrap = $('qs'); wrap.textContent = '';
  DATA.criteria.forEach((c, i) => {
    const q = el('div', 'q');
    const h = el('h3');
    h.appendChild(el('span', 'qn', String(i + 1)));
    const ttl = el('span', '', LANG === 'ar' ? c.ar : c.en);
    ttl.appendChild(el('span', 'alt', LANG === 'ar' ? c.en : c.ar));
    h.appendChild(ttl);
    q.appendChild(h);
    q.appendChild(el('p', 'h', LANG === 'ar' ? c.hintAr : c.hintEn));
    q.appendChild(el('p', 'h2', LANG === 'ar' ? c.hintEn : c.hintAr));
    const row = el('div', 'stars'), lab = el('div', 'stars-l', scores[c.id] ? scaleText(scores[c.id]) : '');
    for (let n = 1; n <= 5; n++) {
      const b = el('button', scores[c.id] >= n ? 'lit' : '', '⭐');
      b.type = 'button';
      b.setAttribute('aria-label', c.en + ' ' + n + '/5');
      b.addEventListener('click', () => {
        scores[c.id] = n;
        [...row.children].forEach((x, k) => x.classList.toggle('lit', k < n));
        lab.textContent = scaleText(n);
        showError(''); updateProgress();
      });
      row.appendChild(b);
    }
    q.appendChild(row); q.appendChild(lab);
    wrap.appendChild(q);
  });
}

function updateProgress() {
  if (!DATA) return;
  const n = DATA.criteria.filter(c => scores[c.id]).length, m = DATA.criteria.length;
  $('prog').textContent = t('prog', n, m);
  $('tot').textContent = t('total') + ' ' + Object.values(scores).reduce((a, b) => a + b, 0) + ' / ' + m * 5;
}

function renderNames() {
  const q = $('q').value.trim().toLowerCase();
  const box = $('names'); box.textContent = '';
  const list = DATA.projects.filter(p => (!yearFilter || p.year === yearFilter) &&
    (!q || p.name.toLowerCase().includes(q) || (p.topic || '').toLowerCase().includes(q)));
  list.slice(0, 60).forEach(p => {
    const b = el('button', 'name' + (voted.includes(p.id) ? ' done' : ''));
    b.type = 'button';
    b.appendChild(el('span', '', p.name));
    b.appendChild(el('small', '', p.year));
    b.addEventListener('click', () => openRate(p));
    box.appendChild(b);
  });
  if (!list.length) box.appendChild(el('div', 'empty', both('noMatch')));
  else if (list.length > 60) box.appendChild(el('div', 'empty', both('narrow')));
}

function openFind() { current = null; showOnly('find'); renderNames(); }

function setVoter(id, silent) {
  voter = id; store('aoc_voter', id);
  $('whoName').textContent = both(id);
  $('voterBox').hidden = true; $('whoLine').hidden = false;
  if (!silent) showError('');
}

function openRate(p) {
  current = p;
  for (const k in scores) delete scores[k];
  buildCriteria(); updateProgress();
  $('comment').value = ''; $('comment').hidden = true; $('addc').hidden = false;
  $('spName').textContent = p.name;
  $('spMeta').textContent = [p.year, p.title || p.topic].filter(Boolean).join(' · ');
  if (voter) setVoter(voter);
  else { $('voterBox').hidden = false; $('whoLine').hidden = true; }
  showError('');
  showOnly('rate');
  if (voted.includes(p.id)) showError(both('errDone'));
}

function send() {
  if (!voter) { showError(both('errWho')); $('voterBox').scrollIntoView({ behavior: 'smooth' }); return; }
  const missing = DATA.criteria.filter(c => !scores[c.id]).length;
  if (missing) return showError(both('errRate', missing));
  if (voted.includes(current.id)) return showError(both('errDone'));
  const btn = $('send'); btn.disabled = true; btn.textContent = t('sending');
  const p = current;
  google.script.run
    .withSuccessHandler(res => {
      markVoted(p.id);
      $('doneName').textContent = p.name;
      $('doneTotal').textContent = res.total + ' / ' + res.max + ' ⭐';
      btn.disabled = false; btn.textContent = both('send');
      showOnly('done');
    })
    .withFailureHandler(err => {
      showError(String((err && err.message) || err).replace(/^.*?Error:\s*/, ''));
      btn.disabled = false; btn.textContent = both('send');
    })
    .submitVote({ projectId: p.id, voterType: voter, scores: DATA.criteria.map(c => scores[c.id]), comment: $('comment').value, deviceId: deviceId() });
}

function start() {
  if (!DATA.votingOpen) return showOnly('closed');
  const pre = DATA.projects.find(p => p.id === CONFIG.projectId);
  if (pre) openRate(pre); else openFind();
}

// events
document.querySelectorAll('.langbtn').forEach(b => b.addEventListener('click', () => {
  chosen = true; setLang(b.dataset.lang);
  if (DATA) start(); else showOnly('loading');
}));
$('langsw').addEventListener('click', () => setLang(other()));
$('q').addEventListener('input', renderNames);
$('changeWho').addEventListener('click', () => { $('voterBox').hidden = false; $('whoLine').hidden = true; });
$('addc').addEventListener('click', () => { $('comment').hidden = false; $('addc').hidden = true; $('comment').focus(); });
$('send').addEventListener('click', send);
$('backBtn').addEventListener('click', openFind);
$('again').addEventListener('click', openFind);

// boot: the language question comes first (remembered on this phone afterwards)
const savedLang = store('aoc_lang');
if (savedLang === 'ar' || savedLang === 'en') { chosen = true; setLang(savedLang); }
else showOnly('lang');

google.script.run
  .withSuccessHandler(data => {
    DATA = data;
    applyText();
    if (chosen) start();
  })
  .withFailureHandler(() => { $('loading').hidden = false; $('loading').textContent = 'تعذّر التحميل، يرجى إعادة المحاولة — Could not load, please refresh.'; })
  .getPublicData();
</script>
</body>
</html>
